{% extends 'core/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4">Editar Evaporación</h2>
    <div class="card shadow-lg p-4">
        <form method="post">
            {% csrf_token %}

            <div class="row">
                {% for field in form %}
                    <div class="col-md-6 mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                            <small class="form-text text-muted">{{ field.help_text }}</small>
                        {% endif %}
                        {% for error in field.errors %}
                            <div class="text-danger">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}
            </div>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <button type="submit" class="btn btn-success px-4">Guardar</button>
                <a href="{% url 'evaporacion_list' %}" class="btn btn-danger px-4">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<style>
    /* Custom Input Styling */
    input, select, textarea {
        width: 100%;
        padding: 8px;
        border: 2px solid #216c2a;
        border-radius: 5px;
        background-color: #e6f9e6;
        color: #003366;
        font-weight: bold;
        transition: all 0.3s ease-in-out;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #0d4d14;
        background-color: #baf7ba;
        box-shadow: 0px 0px 12px rgba(13, 77, 20, 0.8);
        transform: scale(1.02);
        outline: none;
    }

    /* Card styling */
    .card {
        border-radius: 10px;
        background: white;
    }

    /* Button styling */
    .btn-success {
        background-color: #216c2a;
        border-color: #216c2a;
    }

    .btn-success:hover {
        background-color: #0d4d14;
        border-color: #0b3c10;
    }

    .btn-danger {
        background-color: rgb(196, 38, 38);
        border-color: rgb(150, 30, 30);
    }

    .btn-danger:hover {
        background-color: rgb(160, 30, 30);
        border-color: rgb(130, 25, 25);
    }
</style>

{% endblock %}
