{% extends 'core/base.html' %}
{% block content %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{% static 'core/css/style.css' %}">
    <title>Centro de carga de datos</title>
</head>
<body>
    <h1>Centro de carga de datos</h1>
    <img src="{% static 'core/imgs/logo.PNG' %}" alt="Logo">
    {% if not user.is_authenticated %}
        <div class="d-grid gap-2 col-6 mx-auto">  
            <a class="btn btn-outline-dark" href="{% url 'signin' %}" role="button">Iniciar Sesión</a>
        </div>
    {% endif %}
    <img src="{% static 'core/imgs/PlantaBio4.jpg' %}" style="max-width: 100%; height: auto;"/>
</body>
</html>
{% endblock %}
